# Cloud APK build, like Expo's EAS "preview" profile: GitHub's servers install Flutter and the
# Android SDK, run the tests, build a release APK, and attach it to the run under Artifacts.
name: Android APK

on:
  workflow_dispatch: # the "Run workflow" button on the Actions tab
  push:
    branches: [main, redesign/counter-ui]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      # A failing test stops the run, so a broken build never reaches a phone
      - run: flutter test

      # The installed app was signed with this keystore; signing with any other key would make
      # Android refuse the update, and uninstalling first would wipe the shop's local data.
      - name: Restore signing keystore
        env:
          ESPASYO_KEYSTORE_BASE64: ${{ secrets.ESPASYO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ESPASYO_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ESPASYO_KEYSTORE_BASE64 is missing; refusing to build an APK that cannot update the installed app."
            exit 1
          fi
          echo "$ESPASYO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/espasyo.keystore"

      # arm64 for phones, x64 for x86_64 emulators such as LDPlayer. An arm64-only APK crashes there:
      # the emulator's ARM translator (houdini) cannot start Flutter's precompiled Dart VM.
      - name: Build release APK (arm64 + x64)
        env:
          ESPASYO_KEYSTORE_PATH: ${{ runner.temp }}/espasyo.keystore
          ESPASYO_KEYSTORE_PASSWORD: ${{ secrets.ESPASYO_KEYSTORE_PASSWORD }}
          ESPASYO_KEY_ALIAS: ${{ secrets.ESPASYO_KEY_ALIAS }}
          ESPASYO_KEY_PASSWORD: ${{ secrets.ESPASYO_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - uses: actions/upload-artifact@v4
        with:
          name: espasyo-${{ github.ref_name == 'main' && 'main' || 'preview' }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/espasyo.keystore"
